<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design Request — Spyne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app app--form-only">
  <aside class="sidebar">
    <div class="side-brand">
      <div class="side-logo" aria-hidden="true"></div>
      <div>
        <b>Design Request</b>
        <span>Spyne creative team</span>
      </div>
    </div>
    <nav class="side-nav">
      <button type="button" class="nav-btn" id="navRequest" aria-current="true">Submit a request</button>
      <button type="button" class="nav-btn" id="navMine">My requests</button>
      <div class="side-label">Need design work?</div>
      <p class="side-copy">Submit here. Marketing teammates follow the request in Marketing Central. Everyone else uses My requests on this page.</p>
    </nav>
    <div class="side-foot">
      <p class="role-hint">Questions? Ping the design team on Slack.</p>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Submit a design request</h1>
        <p class="sub" id="pageSub">Anyone at Spyne can use this form</p>
      </div>
    </header>
    <div class="content">
      <div id="banner"></div>
      <section id="view-request"></section>
      <section id="view-confirm" hidden></section>
      <section id="view-mine" hidden></section>
      <section id="view-check"></section>
    </div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
